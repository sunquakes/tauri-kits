    <style id="theme-vars">
/* Smart City Dashboard — Brand Colors & Type
   Derived from reference: deep navy/black background, electric blue,
   magenta/pink, cyan accents. Futuristic HUD / data-screen aesthetic. */

:root {
  /* ===== Surface / Background ===== */
  --sc-bg-primary: #050b1a;
  --sc-bg-secondary: #0a1530;
  --sc-bg-panel: rgba(10, 24, 56, 0.55);
  --sc-bg-panel-solid: #0c1a3a;
  --sc-bg-overlay: rgba(5, 11, 26, 0.85);

  /* ===== Brand Hues ===== */
  --sc-cyan: #00d4ff;
  --sc-cyan-soft: #4fe2ff;
  --sc-blue: #0080ff;
  --sc-blue-deep: #0048b0;
  --sc-magenta: #ff00a0;
  --sc-magenta-soft: #ff6b9d;
  --sc-purple: #7b3cff;
  --sc-gold: #ffcc00;

  /* ===== Semantic States ===== */
  --sc-success: #00ffa6;
  --sc-warning: #ffcc00;
  --sc-danger: #ff3b5c;
  --sc-info: #00d4ff;

  /* ===== Text ===== */
  --sc-text-primary: #e8f4ff;
  --sc-text-secondary: #8fb3d9;
  --sc-text-tertiary: #5a7da6;
  --sc-text-accent: #00d4ff;
  --sc-text-magenta: #ff6b9d;

  /* ===== Border / Divider ===== */
  --sc-border-cyan: rgba(0, 212, 255, 0.35);
  --sc-border-soft: rgba(0, 212, 255, 0.15);
  --sc-divider: rgba(143, 179, 217, 0.12);

  /* ===== Glow ===== */
  --sc-glow-cyan: 0 0 12px rgba(0, 212, 255, 0.6);
  --sc-glow-magenta: 0 0 12px rgba(255, 0, 160, 0.55);
  --sc-glow-blue: 0 0 16px rgba(0, 128, 255, 0.5);

  /* ===== Gradients ===== */
  --sc-gradient-cyan-magenta: linear-gradient(90deg, #00d4ff 0%, #7b3cff 50%, #ff00a0 100%);
  --sc-gradient-panel: linear-gradient(180deg, rgba(0, 212, 255, 0.08) 0%, rgba(10, 24, 56, 0.6) 100%);
  --sc-gradient-header: linear-gradient(90deg, transparent 0%, rgba(0, 212, 255, 0.25) 50%, transparent 100%);

  /* ===== Typography ===== */
  --sc-font-sans: "PingFang SC", "Microsoft YaHei", "HarmonyOS Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --sc-font-digital: "DIN Alternate", "Bahnschrift", "Impact", "PingFang SC", sans-serif;
  --sc-font-mono: "JetBrains Mono", "Consolas", "Courier New", monospace;

  /* Type scale (dashboard large screen) */
  --sc-fs-display: 56px;
  --sc-fs-h1: 32px;
  --sc-fs-h2: 22px;
  --sc-fs-h3: 18px;
  --sc-fs-body: 14px;
  --sc-fs-caption: 12px;
  --sc-fs-mini: 10px;

  /* Weight */
  --sc-fw-regular: 400;
  --sc-fw-medium: 500;
  --sc-fw-semibold: 600;
  --sc-fw-bold: 700;

  /* Line height */
  --sc-lh-tight: 1.2;
  --sc-lh-normal: 1.5;

  /* ===== Radius ===== */
  --sc-radius-sm: 4px;
  --sc-radius-md: 8px;
  --sc-radius-lg: 12px;
  --sc-radius-pill: 999px;

  /* ===== Spacing ===== */
  --sc-space-xs: 4px;
  --sc-space-sm: 8px;
  --sc-space-md: 16px;
  --sc-space-lg: 24px;
  --sc-space-xl: 32px;

  /* ===== Semantic Aliases (for fill-html-head.mjs / Tailwind bridge) ===== */
  --sc-background: var(--sc-bg-primary);
  --sc-foreground: var(--sc-text-primary);
  --sc-card: var(--sc-bg-panel);
  --sc-card-foreground: var(--sc-text-primary);
  --sc-popover: var(--sc-bg-panel-solid);
  --sc-popover-foreground: var(--sc-text-primary);
  --sc-primary: var(--sc-cyan);
  --sc-primary-foreground: var(--sc-bg-primary);
  --sc-secondary: var(--sc-blue-deep);
  --sc-secondary-foreground: var(--sc-text-primary);
  --sc-muted: var(--sc-bg-secondary);
  --sc-muted-foreground: var(--sc-text-secondary);
  --sc-accent: var(--sc-magenta);
  --sc-accent-foreground: var(--sc-text-primary);
  --sc-destructive: var(--sc-danger);
  --sc-destructive-foreground: var(--sc-text-primary);
  --sc-border: var(--sc-border-cyan);
  --sc-input: var(--sc-border-cyan);
  --sc-ring: var(--sc-cyan);
  --sc-radius: var(--sc-radius-md);
}

    </style>

<body class="font-sans antialiased">
    <main>
      <div class="sc-shell overflow-y-auto no-scrollbar" data-viewport-mode="app-shell" data-scroll-region="primary">
        <!-- ===== Admin Back Button ===== -->
        <a href="../admin.html" class="sc-admin-btn" data-dom-id="back-admin" title="返回 Admin 首页">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Admin</span>
        </a>
        <!-- ===== HEADER (vc-02) ===== -->
        <header class="sc-header">
          <div class="sc-header-deco left">
            <span class="deco-diamond"></span>
            <span class="deco-line"></span>
            <span class="deco-bar"></span>
          </div>
          <div class="sc-header-title-block">
            <span class="sc-header-corner tl"></span>
            <span class="sc-header-corner tr"></span>
            <span class="sc-header-corner bl"></span>
            <span class="sc-header-corner br"></span>
            <h1 class="sc-header-title">城市运行态势监测平台</h1>
            <p class="sc-header-subtitle">交通 · 环境 · 能耗 · 安全</p>
          </div>
          <div class="sc-header-deco right">
            <span class="deco-bar"></span>
            <span class="deco-line"></span>
            <span class="deco-diamond"></span>
          </div>
        </header>

        <!-- ===== MAIN 3-COLUMN (vc-03) ===== -->
        <div class="sc-main">
          <!-- LEFT: TRAFFIC (vc-04) -->
          <section class="sc-panel sc-traffic">
            <div class="sc-panel-header">
              <span class="sc-panel-icon"><i data-lucide="car" style="width:16px;height:16px;color:var(--sc-cyan);"></i></span>
              <span class="sc-panel-title">交通监测</span>
              <span class="sc-panel-status">实时</span>
            </div>
            <div class="sc-panel-body">
              <div class="sc-metric-block">
                <div class="sc-metric-icon-ring"><i data-lucide="car" style="width:22px;height:22px;color:var(--sc-cyan);"></i></div>
                <div class="sc-metric-text">
                  <div class="sc-metric-label">交通流量</div>
                  <div class="sc-metric-value cyan">92.6<span class="sc-unit">万次</span></div>
                </div>
              </div>
              <div class="sc-gauge-row">
                <div class="sc-gauge-item">
                  <div class="sc-gauge-circle magenta">
                    <div class="sc-gauge-center">
                      <span class="sc-gauge-number">1.28</span>
                    </div>
                  </div>
                  <div class="sc-gauge-label">拥堵指数</div>
                </div>
                <div class="sc-gauge-item">
                  <div class="sc-gauge-circle cyan small">
                    <div class="sc-gauge-center">
                      <span class="sc-gauge-number">46</span>
                      <span class="sc-gauge-unit">km/h</span>
                    </div>
                  </div>
                  <div class="sc-gauge-label">平均车速</div>
                </div>
              </div>
              <div class="sc-chart-box">
                <div class="sc-chart-title">24小时车速趋势</div>
                <div class="sc-chart-wrap"><canvas id="speedChart" width="320" height="130"></canvas></div>
              </div>
            </div>
          </section>

          <!-- CENTER: 3D CITY (vc-05) -->
          <section class="sc-panel sc-city">
            <div class="sc-panel-header">
              <span class="sc-panel-icon"><i data-lucide="building" style="width:16px;height:16px;color:var(--sc-cyan);"></i></span>
              <span class="sc-panel-title">城市数字孪生</span>
              <span class="sc-panel-status">在线</span>
            </div>
            <div class="sc-city-stage">
              <div class="sc-city-rings"></div>
              <div class="sc-city-radar"></div>
              <div class="sc-city-glow"></div>
              <div class="sc-city-buildings">
                <div class="sc-building" style="width:18px;height:50px;opacity:0.5;"></div>
                <div class="sc-building" style="width:22px;height:70px;opacity:0.6;"></div>
                <div class="sc-building" style="width:26px;height:100px;opacity:0.75;"></div>
                <div class="sc-building" style="width:30px;height:140px;opacity:0.9;"></div>
                <div class="sc-building" style="width:28px;height:120px;opacity:0.8;"></div>
                <div class="sc-building" style="width:22px;height:85px;opacity:0.65;"></div>
                <div class="sc-building" style="width:20px;height:60px;opacity:0.5;"></div>
                <div class="sc-building" style="width:18px;height:55px;opacity:0.45;"></div>
              </div>
              <svg class="sc-arteries" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
                <defs>
                  <linearGradient id="arteryGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:var(--sc-magenta);stop-opacity:1"/>
                    <stop offset="50%" style="stop-color:var(--sc-purple);stop-opacity:0.8"/>
                    <stop offset="100%" style="stop-color:var(--sc-cyan);stop-opacity:1"/>
                  </linearGradient>
                  <linearGradient id="arteryGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:var(--sc-cyan);stop-opacity:0.6"/>
                    <stop offset="100%" style="stop-color:var(--sc-magenta-soft);stop-opacity:0.9"/>
                  </linearGradient>
                </defs>
                <path d="M 40 200 Q 200 40 360 200" fill="none" stroke="url(#arteryGrad1)" stroke-width="2" class="sc-artery-path"/>
                <path d="M 70 230 Q 200 90 330 230" fill="none" stroke="url(#arteryGrad2)" stroke-width="1.5" class="sc-artery-path" style="animation-delay:0.5s;"/>
                <path d="M 50 170 Q 200 270 350 170" fill="none" stroke="url(#arteryGrad1)" stroke-width="1" opacity="0.5" class="sc-artery-path" style="animation-delay:1s;"/>
              </svg>
              <div class="sc-hex-marker m1"><i data-lucide="map-pin" style="width:12px;height:12px;color:var(--sc-cyan);"></i></div>
              <div class="sc-hex-marker m2"><i data-lucide="activity" style="width:12px;height:12px;color:var(--sc-magenta-soft);"></i></div>
              <div class="sc-hex-marker m3"><i data-lucide="radio" style="width:12px;height:12px;color:var(--sc-cyan);"></i></div>
              <div class="sc-city-label">CITY DIGITAL TWIN · 实时态势</div>
            </div>
          </section>

          <!-- RIGHT: ENVIRONMENT (vc-06) -->
          <section class="sc-panel sc-env">
            <div class="sc-panel-header">
              <span class="sc-panel-icon"><i data-lucide="leaf" style="width:16px;height:16px;color:var(--sc-cyan);"></i></span>
              <span class="sc-panel-title">环境监测</span>
              <span class="sc-panel-status">实时</span>
            </div>
            <div class="sc-panel-body">
              <div class="sc-metric-block">
                <div class="sc-gauge-circle green">
                  <div class="sc-gauge-center">
                    <span class="sc-gauge-text">优</span>
                  </div>
                </div>
                <div class="sc-metric-text">
                  <div class="sc-metric-label">空气质量</div>
                  <div class="sc-metric-value-small">PM2.5 28<span class="sc-unit">μg/m³</span></div>
                </div>
              </div>
              <div class="sc-noise-block">
                <div class="sc-noise-gauges">
                  <div class="sc-vbar-item">
                    <div class="sc-vbar">
                      <div class="sc-vbar-fill"></div>
                    </div>
                    <div class="sc-vbar-label">dB</div>
                  </div>
                  <div class="sc-gauge-item">
                    <div class="sc-gauge-circle cyan">
                      <div class="sc-gauge-center">
                        <span class="sc-gauge-number">42</span>
                        <span class="sc-gauge-unit">dB</span>
                      </div>
                    </div>
                    <div class="sc-gauge-label">噪声指数</div>
                  </div>
                </div>
              </div>
              <div class="sc-chart-box">
                <div class="sc-chart-title">24小时噪声趋势</div>
                <div class="sc-chart-wrap"><canvas id="noiseChart" width="320" height="130"></canvas></div>
              </div>
            </div>
          </section>
        </div>

        <!-- ===== BOTTOM: 4 INDICATOR CARDS (vc-07) ===== -->
        <div class="sc-bottom">
          <div class="sc-indicator-card">
            <div class="sc-hex-icon"><i data-lucide="zap" style="width:24px;height:24px;color:var(--sc-cyan);"></i></div>
            <div class="sc-indicator-info">
              <div class="sc-indicator-value">1,280<span class="sc-unit">吨标煤</span></div>
              <div class="sc-indicator-label">能耗</div>
            </div>
          </div>
          <div class="sc-indicator-card">
            <div class="sc-hex-icon magenta"><i data-lucide="shield-alert" style="width:24px;height:24px;color:var(--sc-magenta-soft);"></i></div>
            <div class="sc-indicator-info">
              <div class="sc-indicator-value magenta">36<span class="sc-unit">起</span></div>
              <div class="sc-indicator-label">事件预警</div>
            </div>
          </div>
          <div class="sc-indicator-card">
            <div class="sc-hex-icon"><i data-lucide="video" style="width:24px;height:24px;color:var(--sc-cyan);"></i></div>
            <div class="sc-indicator-info">
              <div class="sc-indicator-value">98.2<span class="sc-unit">%</span></div>
              <div class="sc-indicator-label">摄像头在线</div>
            </div>
          </div>
          <div class="sc-indicator-card">
            <div class="sc-hex-icon"><i data-lucide="clipboard-list" style="width:24px;height:24px;color:var(--sc-cyan);"></i></div>
            <div class="sc-indicator-info">
              <div class="sc-indicator-value">96.7<span class="sc-unit">%</span></div>
              <div class="sc-indicator-label">工单处理</div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <style>
      /* === Body fixed viewport (vc-01) === */
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        min-height: 100vh;
        font-family: var(--sc-font-sans);
        background: var(--sc-bg-primary);
        position: relative;
      }
      /* Background grid texture (vc-08) */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(var(--sc-border-soft) 1px, transparent 1px),
          linear-gradient(90deg, var(--sc-border-soft) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.4;
        pointer-events: none;
